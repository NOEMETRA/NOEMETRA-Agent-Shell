<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOEMETRA Cyber Purple Suite</title>
  <style>
    :root {
      --bg: #070b12; --card: #0e1624; --border: rgba(148, 163, 184, 0.18);
      --fg: #f1f5f9; --muted: #94a3b8;
      --red: #f43f5e; --blue: #38bdf8; --purple: #a855f7; --green: #10b981; --amber: #f59e0b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: #0a101b; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, input, textarea, button { background: #0c1422; color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: linear-gradient(135deg, #be123c, #7e22ce); border-color: rgba(168, 85, 247, 0.5); }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 14px; padding: 16px; min-height: calc(100vh - 64px); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow: auto; }
    .ev-item { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 8px; border-radius: 8px; border: 1px solid transparent; margin-bottom: 6px; background: rgba(15, 23, 42, 0.7); }
    .ev-item.active { border-color: var(--purple); background: rgba(168, 85, 247, 0.14); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 4px; }
    .b-red { background: rgba(244, 63, 94, 0.16); color: #fda4af; }
    .b-blue { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .b-purple { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
    .b-green { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; }
    .b-amber { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }
    .stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stage-card { background: rgba(15, 23, 42, 0.65); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
    .claim-card { background: rgba(15, 23, 42, 0.65); border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 8px; }
    .claim-card.supported { border-left-color: var(--red); }
    .claim-card.refuted { border-left-color: var(--green); }
    .note-box { margin-top: 6px; padding: 6px 9px; border-radius: 7px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); color: #fde68a; font-size: 11.5px; }
    pre { background: #050911; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; border: 1px solid var(--border); }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong style="font-size:15px;">NOEMETRA Cyber Purple Suite</strong>
      <span id="privacyBadge" class="badge b-green">Solo Locale + Scrubber</span>
    </div>
    <div class="row">
      <label class="row"><input type="checkbox" id="allowRemoteChk"> Consenti Cloud (PII/IP Scrubbing)</label>
      <label class="row"><input type="checkbox" id="useLlmChk"> Arricchimento LLM</label>
      <select id="redProv"></select><select id="redModel"></select>
      <select id="blueProv"></select><select id="blueModel"></select>
      <button class="primary" onclick="runBenchmark()">Benchmark Single vs Purple</button>
    </div>
  </header>
  <div class="grid">
    <div class="panel">
      <h3 style="margin-top:0;">Scenari & Artefatti</h3>
      <div class="row" style="margin-bottom:8px;">
        <select id="scenarioSelect" style="flex:1;"></select>
        <button class="primary" onclick="analyzeSelectedScenario()">Analizza</button>
      </div>
      <div class="stage-card" style="margin-bottom:10px;">
        <strong>ACK Detonation Arena (4 Missioni CoW)</strong>
        <select id="ackMissionSelect" onchange="toggleAckMissionInputs()" style="width:100%;margin:6px 0;">
          <option value="ack-m1-exploit-patch-bypass">1. Exploit-to-Patch &amp; Bypass Loop</option>
          <option value="ack-m2-detection-evasion-arena">2. Detection vs. Evasion Arena</option>
          <option value="ack-m3-attack-path-hardening">3. Attack-Path Audit &amp; Live Hardening</option>
          <option value="ack-m4-fuzz-to-fix-pipeline">4. Fuzz-to-Fix Pipeline</option>
        </select>
        <select id="ackDefenseSelect" style="width:100%;margin-bottom:6px;">
          <option value="structural">Difesa: Structural + Containment (Reale)</option>
          <option value="naive_string_replace">Anti-Cheat: Naive String Replace</option>
          <option value="naive_block_all">Anti-Cheat: Naive Block-All</option>
          <option value="overbroad_alert_all">Anti-Cheat: Overbroad Alert-All</option>
        </select>
        <div id="ackM3Box" style="display:none;margin-bottom:6px;">
          <textarea id="ackTargetConfig" rows="3" placeholder="target_config_content (manifest systemd/K8s opzionale)" style="width:100%;"></textarea>
        </div>
        <div id="ackM4WorkspaceBox" style="display:none;margin-bottom:6px;">
          <input id="ackTargetFilePath" placeholder="target_file_path (file parser Python sul PC)" style="width:100%;margin-bottom:4px;">
          <input id="ackTargetFunction" placeholder="target_function (es. parse_packet)" style="width:100%;margin-bottom:4px;">
          <input id="ackValidCorpusDir" placeholder="valid_corpus_dir (dir input validi opzionale)" style="width:100%;margin-bottom:4px;">
          <select id="ackWorkspaceMode" style="width:100%;">
            <option value="isolated_copy">workspace_mode: isolated_copy</option>
            <option value="git_worktree">workspace_mode: git_worktree</option>
          </select>
        </div>
        <button class="primary" onclick="runAckMission()" style="width:100%;">Avvia Missione ACK Out-of-Band</button>
      </div>
      <details>
        <summary style="cursor:pointer;color:var(--muted);margin-bottom:8px;">Analisi Artefatto Custom (Log / Codice / YAML)</summary>
        <input id="customTitle" placeholder="Titolo caso" style="width:100%;margin-bottom:6px;">
        <textarea id="customContent" rows="5" placeholder="Incolla log JSONL/Syslog, HTTP trace, codice Python o YAML IaC..." style="width:100%;margin-bottom:6px;"></textarea>
        <button onclick="analyzeCustom()" style="width:100%;">Avvia Audit Purple</button>
      </details>
      <h4>Evidenze Verbatim (<span id="evCount">0</span>)</h4>
      <div id="evList"></div>
    </div>
    <div class="panel" id="reportPanel">
      <p style="color:var(--muted);">Seleziona uno scenario o incolla un artefatto per avviare lo scontro Red Operator vs Blue Critic e il Purple Replay.</p>
    </div>
  </div>
  <script>
    const API = '/api/plugins/cyber-purple-suite';
    let currentReport = null;
    function esc(val) {
      return String(val == null ? '' : val).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
    let currentAckSessionId = '';
    let pendingAckApproval = null;
    async function apiFetch(path, opts) {
      const mergedHeaders = { 'Content-Type': 'application/json', ...((opts && opts.headers) || {}) };
      const res = await fetch(API + path, { ...opts, headers: mergedHeaders });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function populateModelSelects(modelsInfo) {
      const allowRemote = Boolean(modelsInfo.allow_remote);
      document.getElementById('allowRemoteChk').checked = allowRemote;
      document.getElementById('privacyBadge').textContent = allowRemote ? 'Cloud + Scrubber IP/Secret' : 'Solo Locale (Air-Gapped)';
      document.getElementById('privacyBadge').className = 'badge ' + (allowRemote ? 'b-amber' : 'b-green');
      const opts = [['ollama', modelsInfo.ollama?.models || ['gemma4:12b']]];
      Object.entries(modelsInfo.local_runtimes || {}).forEach(([k, v]) => opts.push([k, v.models || []]));
      if (allowRemote) {
        if (modelsInfo.codex_oauth?.configured) opts.push(['openai-codex', modelsInfo.codex_oauth.models || []]);
        if (modelsInfo.cloud_providers?.openrouter?.free_models?.length) opts.push(['openrouter', modelsInfo.cloud_providers.openrouter.free_models]);
        if (modelsInfo.cloud_providers?.ollama_cloud?.models?.length) opts.push(['ollama-cloud', modelsInfo.cloud_providers.ollama_cloud.models]);
        if (modelsInfo.cloud_providers?.opencode_free?.models?.length) opts.push(['opencode-free', modelsInfo.cloud_providers.opencode_free.models]);
      }
      [['redProv', 'redModel', modelsInfo.red_provider, modelsInfo.red_model], ['blueProv', 'blueModel', modelsInfo.blue_provider, modelsInfo.blue_model]].forEach(([pId, mId, curP, curM]) => {
        const pSel = document.getElementById(pId);
        const mSel = document.getElementById(mId);
        pSel.innerHTML = opts.map(([p]) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
        pSel.value = opts.some(([p]) => p === curP) ? curP : 'ollama';
        const mList = (opts.find(([p]) => p === pSel.value) || ['', ['gemma4:12b']])[1];
        mSel.innerHTML = (mList.length ? mList : [curM || 'gemma4:12b']).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
        if (curM) mSel.value = curM;
      });
    }
    async function saveConfig() {
      await apiFetch('/config', {
        method: 'POST',
        body: JSON.stringify({
          allow_remote: document.getElementById('allowRemoteChk').checked,
          use_llm: document.getElementById('useLlmChk').checked,
          red_provider: document.getElementById('redProv').value,
          red_model: document.getElementById('redModel').value,
          blue_provider: document.getElementById('blueProv').value,
          blue_model: document.getElementById('blueModel').value,
        })
      });
      populateModelSelects(await apiFetch('/models'));
    }
    ['allowRemoteChk', 'useLlmChk', 'redProv', 'redModel', 'blueProv', 'blueModel'].forEach(id => {
      document.getElementById(id).addEventListener('change', saveConfig);
    });
    function highlightEvidence(eid) {
      document.querySelectorAll('.ev-item').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('ev-' + eid);
      if (target) { target.classList.add('active'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    document.getElementById('reportPanel').addEventListener('click', (evt) => {
      const btn = evt.target && evt.target.closest ? evt.target.closest('[data-eid]') : null;
      if (btn) highlightEvidence(btn.getAttribute('data-eid'));
    });
    function claimStatusHtml(st) {
      if (st === 'supported') return '<span class="badge b-red">SUPPORTATA</span>';
      if (st === 'refuted') return '<span class="badge b-green">CONFUTATA</span>';
      return '<span class="badge b-amber">IPOTESI APERTA</span>';
    }
    function claimPrioHtml(pr) {
      if (pr === 'critical') return '<span class="badge b-red">PRIORITA CRITICA</span>';
      if (pr === 'high') return '<span class="badge b-amber">PRIORITA ALTA</span>';
      if (pr === 'low') return '<span class="badge b-purple">PRIORITA BASSA</span>';
      return '<span class="badge b-blue">PRIORITA MEDIA</span>';
    }
    function renderReport(r) {
      currentReport = r;
      document.getElementById('evCount').textContent = String(r.ingestion.evidences.length);
      document.getElementById('evList').innerHTML = r.ingestion.evidences.map(ev =>
        `<div class="ev-item" id="ev-${esc(ev.evidence_id)}"><div><span class="badge b-purple">${esc(ev.evidence_id)}</span><span class="badge">${esc(ev.source_type)}</span></div><div>${esc(ev.raw_content)}</div></div>`
      ).join('');
      const v = r.verdict;
      const diag = v.diagnosis || {};
      const sim = v.simulation || {};
      const rem = v.remediation_verification || {};
      const claims = Array.isArray(r.red_report?.claims) ? r.red_report.claims : [];
      const defaultMode = (diag.analysis_mode === 'artifact_review' || r.ingestion.source_kind === 'code' || r.ingestion.source_kind === 'config')
        ? 'verify_patch' : 'append_evidence';
      const citeBtn = eid => `<button type="button" class="badge b-purple" data-eid="${esc(eid)}">${esc(eid)}</button>`;
      document.getElementById('reportPanel').innerHTML = `
        <div style="border-left:4px solid var(--purple);padding-left:12px;margin-bottom:14px;">
          <span class="badge b-purple">${esc(v.verdict)}</span>
          <span class="badge b-green">Confidence: ${Math.round(v.confidence_score * 100)}%</span>
          <span class="badge b-blue">Replay Coverage: ${Math.round(v.replay.detection_coverage * 100)}%</span>
          <span class="badge b-green">Baseline FPR: ${Math.round(v.replay.false_positive_rate * 100)}%</span>
          ${(v.incoherent_contradictions_rejected || []).length ? `<span class="badge b-amber">Contraddizioni incoerenti scartate: ${v.incoherent_contradictions_rejected.length}</span>` : ''}
          <h3 style="margin:6px 0;">${esc(v.winning_hypothesis)}</h3>
          <p style="color:var(--muted);margin:4px 0;">${esc(v.rationale)}</p>
          <p><strong>Test Discriminante:</strong> <code>${esc(v.discriminating_test)}</code></p>
        </div>
        <div class="stage-grid">
          <div class="stage-card">
            <div class="row" style="justify-content:space-between;margin-bottom:4px;"><strong>1. Diagnosi</strong><span class="badge b-amber">${esc(diag.status || 'N/A')}</span></div>
            ${diag.analysis_mode_label ? `<div style="margin-bottom:4px;"><span class="badge b-blue">${esc(diag.analysis_mode_label)}</span></div>` : ''}
            <div>Affermazioni: Supportate ${esc(diag.supported_claims_count ?? 0)} · Aperte ${esc(diag.open_claims_count ?? 0)} · Confutate ${esc(diag.refuted_claims_count ?? 0)}</div>
            ${(diag.high_priority_open_claim_ids || []).length ? `<div style="color:#fcd34d;margin-top:3px;">Dubbi prioritari: ${esc(diag.high_priority_open_claim_ids.join(', '))}</div>` : ''}
            <div style="color:var(--muted);margin-top:4px;">${esc(diag.epistemic_scope || diag.summary || '')}</div>
          </div>
          <div class="stage-card">
            <div class="row" style="justify-content:space-between;margin-bottom:4px;"><strong>2. Simulazione Rilevazione</strong><span class="badge b-blue">${esc(sim.status || 'NOT_APPLICABLE')}</span></div>
            <div>Coverage: ${Math.round((sim.detection_coverage ?? v.replay.detection_coverage ?? 0) * 100)}% | Evasion: ${Math.round((sim.evasion_caught_rate ?? v.replay.evasion_caught_rate ?? 0) * 100)}% | FPR: ${Math.round((sim.false_positive_rate ?? v.replay.false_positive_rate ?? 0) * 100)}%</div>
            <div style="color:var(--muted);margin-top:4px;">${esc(sim.summary || '')}</div>
          </div>
          <div class="stage-card">
            <div class="row" style="justify-content:space-between;margin-bottom:4px;"><strong>3. Verifica della Correzione</strong><span class="badge b-purple">${esc(rem.status || 'UNVERIFIED')}</span></div>
            ${rem.verification_level && rem.verification_level !== 'not_run' ? `<div style="margin-bottom:4px;"><span class="badge b-purple">${rem.verification_level === 'static_artifact_comparison' ? 'Controllo Statico Artefatto' : 'Rivalutazione Evidenze'}</span></div>` : ''}
            ${rem.before_verdict && rem.after_verdict ? `<div>Verdetto: ${esc(rem.before_verdict)} -> ${esc(rem.after_verdict)}</div>` : ''}
            <div style="color:var(--muted);margin-top:4px;">${esc(rem.summary || '')}</div>
            ${rem.operational_caveat ? `<div class="note-box">${esc(rem.operational_caveat)}</div>` : ''}
          </div>
        </div>
        <h4 style="color:#d8b4fe;margin-bottom:6px;">Affermazioni Investigative — Osservato vs Ipotizzato (${claims.length})</h4>
        ${claims.length === 0 ? '<p style="color:var(--muted);">Nessuna affermazione di minaccia aperta o supportata generata per questo artefatto.</p>' : claims.map(c => {
          const miss = Array.isArray(c.missing_conditions) ? c.missing_conditions : [];
          return `<div class="claim-card ${esc(c.status || 'open')}">
            <div class="row" style="margin-bottom:4px;">
              <strong>${esc(c.claim_id)}</strong> ${claimStatusHtml(c.status)} ${claimPrioHtml(c.priority)}
              ${c.technique_id ? `<span class="badge b-blue">${esc(c.tactic || 'MITRE')} (${esc(c.technique_id)})</span>` : ''}
              ${(c.evidence_ids || []).map(citeBtn).join('')}
            </div>
            <div><strong>Osservato:</strong> ${esc(c.observed_fact)}</div>
            <div style="color:var(--muted);"><strong>Ipotesi:</strong> ${esc(c.proposed_interpretation)}</div>
            <div style="color:${miss.length ? '#fcd34d' : '#6ee7b7'};"><strong>Condizioni mancanti:</strong> ${miss.length ? esc(miss.join(' | ')) : 'Nessuna (precondizioni soddisfatte nei record citati)'}</div>
            <div style="color:#d8b4fe;"><strong>Prossima prova:</strong> ${esc(c.confirming_or_refuting_proof)}</div>
            ${c.priority_rationale ? `<div style="color:var(--muted);font-size:11px;margin-top:2px;">Triage: ${esc(c.priority_rationale)}</div>` : ''}
          </div>`;
        }).join('')}
        <div class="stage-card" style="margin:12px 0;">
          <strong>Continua Indagine / Verifica Versione Corretta</strong>
          <div class="row" style="margin:6px 0;">
            <select id="verifyModeSel">
              <option value="append_evidence"${defaultMode === 'append_evidence' ? ' selected' : ''}>Aggiungi Nuove Evidenze / Log (append_evidence)</option>
              <option value="verify_patch"${defaultMode === 'verify_patch' ? ' selected' : ''}>Verifica Artefatto / Codice Corretto (verify_patch)</option>
            </select>
            <button type="button" class="primary" onclick="submitCaseVerification()">Invia Verifica al Caso</button>
          </div>
          <textarea id="verifyContentInput" rows="3" style="width:100%;" placeholder="Incolla ulteriori tracce/evidenze o la versione corretta dell'artefatto..."></textarea>
        </div>
        <h4 style="color:var(--red);">Red Operator — Kill-Chain & Audit Probes</h4>
        ${r.red_report.kill_chain.map(k => `<p><span class="badge b-red">${esc(k.technique_id)}</span> <strong>${esc(k.tactic)}:</strong> ${esc(k.technique_name)} — ${esc(k.reachability_proof)} ${k.evidence_ids.map(citeBtn).join('')}</p>`).join('')}
        ${r.red_report.probes.map(p => `<pre>${esc(p.probe_id)} [${esc(p.safety_level)}] ${esc(p.title)}\nPayload: ${esc(p.payload_or_command)}\nIOC attesa: ${esc(p.expected_ioc)}</pre>`).join('')}
        <h4 style="color:var(--blue);">Blue Investigator & Critic — Contraddizioni, Sigma, YARA, Patch</h4>
        ${r.blue_report.contradictions.map(c => `<p><span class="badge b-blue">${esc(c.impact_on_hypothesis)}</span> ${c.target_claim_id ? `<span class="badge b-purple">${esc(c.target_claim_id)}</span>` : ''} ${c.entity_coherent === false ? '<span class="badge b-amber">Rifiutata (Entita incoerenti)</span>' : ''} ${esc(c.explanation)} ${c.contradicting_evidence_ids.map(citeBtn).join('')}</p>`).join('')}
        <pre>${esc(r.blue_report.sigma_rule.yaml_text)}</pre>
        <pre>${esc(r.blue_report.remediation_patch)}</pre>
      `;
    }
    async function submitCaseVerification() {
      if (!currentReport || !currentReport.case_id) return;
      const inputEl = document.getElementById('verifyContentInput');
      const content = inputEl ? inputEl.value : '';
      if (!content.trim()) return;
      const mode = document.getElementById('verifyModeSel').value;
      const updated = await apiFetch('/verify', {
        method: 'POST',
        body: JSON.stringify({ case_id: currentReport.case_id, mode, content })
      });
      renderReport(updated);
    }
    async function analyzeSelectedScenario() {
      renderReport(await apiFetch('/analyze/scenario', { method: 'POST', body: JSON.stringify({ scenario_id: document.getElementById('scenarioSelect').value }) }));
    }
    async function analyzeCustom() {
      renderReport(await apiFetch('/analyze/custom', { method: 'POST', body: JSON.stringify({ title: document.getElementById('customTitle').value || 'Custom Artifact', content: document.getElementById('customContent').value }) }));
    }
    async function runBenchmark() {
      const b = await apiFetch('/benchmark', { method: 'POST' });
      document.getElementById('reportPanel').innerHTML = `<h3>Benchmark Comparativo (${esc(b.total_scenarios)} Scenari)</h3>
        <p><span class="badge b-red">Single-Agent Accuracy: ${Math.round(b.single_agent_accuracy*100)}% (FPR ${Math.round(b.single_agent_fpr*100)}%)</span>
        <span class="badge b-green">Purple Multi-Agent Accuracy: ${Math.round(b.purple_multi_agent_accuracy*100)}% (FPR ${Math.round(b.purple_fpr*100)}%)</span>
        <span class="badge b-purple">Astensione Ambigui: ${Math.round(b.abstention_accuracy*100)}%</span></p>
        ${b.results.map(x => `<p><strong>${esc(x.title)}</strong>: Atteso=<code>${esc(x.expected_verdict)}</code> | Single=<code>${esc(x.single_agent_verdict)}</code> | Purple=<code>${esc(x.purple_multi_agent_verdict)}</code></p>`).join('')}`;
    }
    let currentAckReport = null;
    function toggleAckMissionInputs() {
      const mId = document.getElementById('ackMissionSelect').value;
      document.getElementById('ackM3Box').style.display = mId === 'ack-m3-attack-path-hardening' ? 'block' : 'none';
      document.getElementById('ackM4WorkspaceBox').style.display = mId === 'ack-m4-fuzz-to-fix-pipeline' ? 'block' : 'none';
    }
    async function runAckMission() {
      const mId = document.getElementById('ackMissionSelect').value;
      const body = {
        mission_id: mId,
        mutation_rounds: 3,
        defense_mode: document.getElementById('ackDefenseSelect').value
      };
      if (mId === 'ack-m3-attack-path-hardening') {
        const cfg = document.getElementById('ackTargetConfig').value;
        if (cfg && cfg.trim()) body.target_config_content = cfg;
      }
      if (mId === 'ack-m4-fuzz-to-fix-pipeline') {
        const fp = document.getElementById('ackTargetFilePath').value.trim();
        if (fp) {
          body.target_file_path = fp;
          const fn = document.getElementById('ackTargetFunction').value.trim();
          const cdir = document.getElementById('ackValidCorpusDir').value.trim();
          if (fn) body.target_function = fn;
          if (cdir) body.valid_corpus_dir = cdir;
          body.workspace_mode = document.getElementById('ackWorkspaceMode').value || 'isolated_copy';
        }
      }
      const rep = await apiFetch('/ack/run', { method: 'POST', body: JSON.stringify(body) });
      renderAckReport(rep);
    }
    async function requestAckApproval() {
      const rep = currentAckReport;
      const ws = rep && rep.workspace_target;
      if (!rep || !rep.run_id || !ws || !ws.target_file_path) return;
      const chk = document.getElementById('ackConfirmApplyChk');
      const revChk = document.getElementById('ackManualReviewChk');
      if (!chk || !chk.checked) return;
      if (rep.manual_review_required && (!revChk || !revChk.checked)) return;
      if (!currentAckSessionId) {
        const st = await apiFetch('/status');
        currentAckSessionId = st.ack_session_id || '';
      }
      pendingAckApproval = await apiFetch('/ack/apply-approval', {
        method: 'POST',
        body: JSON.stringify({
          run_id: rep.run_id,
          target_file_path: ws.target_file_path,
          session_id: currentAckSessionId,
          acknowledge_manual_review: Boolean(revChk && revChk.checked)
        })
      });
      renderAckReport(currentAckReport);
    }
    async function applyAckPatch(runId) {
      const chk = document.getElementById('ackConfirmApplyChk');
      if (!chk || !chk.checked || !pendingAckApproval || pendingAckApproval.run_id !== runId) return;
      const res = await apiFetch('/ack/apply-patch', {
        method: 'POST',
        body: JSON.stringify({
          run_id: runId,
          confirm_apply: true,
          approval_token: pendingAckApproval.approval_token,
          session_id: pendingAckApproval.session_id
        })
      });
      pendingAckApproval = null;
      if (currentAckReport && currentAckReport.workspace_target) {
        currentAckReport.workspace_target.patch_applied = true;
        currentAckReport.workspace_target.applied_at = res.applied_at;
        currentAckReport.workspace_target.approval_id = res.approval_id;
        renderAckReport(currentAckReport);
      }
    }
    function pctStr(val) {
      return val == null ? 'N/A' : `${Math.round(val * 100)}%`;
    }
    function renderAckReport(rep) {
      currentAckReport = rep;
      const m = rep.tpr_fpr_matrix || {};
      const fow = rep.fog_of_war || {};
      const ws = rep.workspace_target || null;
      let domainBadges = '';
      if (m.metric_kind === 'detector_tpr_fpr' && m.detector_metrics_applicable) {
        const fprCls = (m.false_positive_rate || 0) <= 0.05 ? 'b-green' : 'b-red';
        domainBadges = `
          <span class="badge b-green">Detector TPR: ${pctStr(m.true_positive_rate)}</span>
          <span class="badge ${fprCls}">Detector FPR: ${pctStr(m.false_positive_rate)} (n=${esc(m.benign_corpus_size ?? 0)})</span>
          <span class="badge b-blue">Evasion Resistance: ${pctStr(m.evasion_resistance_rate)}</span>`;
      } else if (m.metric_kind === 'parser_fuzz_verification') {
        const semCls = (m.semantic_assertions_count || 0) > 0 ? 'b-green' : 'b-amber';
        const semLbl = (m.semantic_assertions_count || 0) > 0
          ? `Semantic Assertions: ${pctStr(m.semantic_assertion_pass_rate)} (n=${esc(m.semantic_assertions_count)})`
          : 'Semantic Assertions: 0 (non fornite)';
        domainBadges = `
          <span class="badge b-green">Crash Mitigation: ${pctStr(m.crash_mitigation_rate)}</span>
          <span class="badge b-blue">Valid Input Rejection: ${pctStr(m.valid_input_rejection_rate)} (n=${esc(m.benign_corpus_size ?? 0)})</span>
          <span class="badge ${semCls}">${semLbl}</span>`;
      } else {
        domainBadges = `<span class="badge b-green">Exploit/Bypass Mitigation: ${pctStr(m.exploit_mitigation_rate ?? m.evasion_resistance_rate)}</span>`;
      }
      const approvalReady = Boolean(pendingAckApproval && pendingAckApproval.run_id === rep.run_id);
      document.getElementById('reportPanel').innerHTML = `
        <div style="border-left:4px solid ${rep.certified ? 'var(--green)' : (rep.patch_applicable ? 'var(--amber)' : 'var(--red)')};padding-left:12px;margin-bottom:14px;">
          <span class="badge ${rep.certified ? 'b-green' : 'b-red'}">${rep.certified ? 'CERTIFIED' : (rep.patch_applicable ? 'CONTAINED / REVIEW' : 'REJECTED')}</span>
          <span class="badge b-purple">${esc(rep.certification_verdict)}</span>
          ${rep.patch_classification && rep.patch_classification !== 'none' ? `<span class="badge ${rep.patch_classification === 'semantically_verified_patch' ? 'b-green' : 'b-amber'}">${esc(rep.patch_classification)}</span>` : ''}
          ${rep.verification_tier ? `<span class="badge ${rep.verification_tier === 'workspace_target_verification' ? 'b-green' : 'b-blue'}">${esc(rep.verification_tier)}</span>` : ''}
          <span class="badge b-blue">Sandbox: ${esc(rep.sandbox_id)}</span>
          ${rep.subagent_execution_architecture ? `<span class="badge b-purple">Ruoli Red/Blue in-process: ${esc(rep.subagent_execution_architecture)}</span>` : ''}
          ${rep.security_boundary_level ? `<span class="badge b-amber">${esc(rep.security_boundary_level)}</span>` : ''}
          ${rep.isolation_backend ? `<span class="badge b-purple">${esc(rep.isolation_backend)}</span>` : ''}
          ${rep.audit_scope ? `<span class="badge ${(rep.audit_scope === 'cloned_target_manifest' || rep.audit_scope === 'workspace_target_file') ? 'b-green' : 'b-amber'}">${esc(rep.audit_scope)}</span>` : ''}
          ${fow.enforced ? '<span class="badge b-green">Fog of War Enforced</span>' : ''}
          ${rep.shadow_clone_only ? '<span class="badge b-amber">Shadow Clone CoW</span>' : ''}
          ${rep.untrusted_llm_code_warning ? `<div class="note-box">${esc(rep.untrusted_llm_code_warning)}</div>` : ''}
          ${rep.manual_review_required ? `<div class="note-box" style="border-color:var(--red);color:#fecdd3;"><strong>Revisione manuale richiesta:</strong> ${esc((rep.manual_review_reasons || []).join(' · ') || 'Verificare semantica e operazioni sensibili.')}${ws && (ws.sensitive_ops_in_original || []).length ? `<br>Op. sensibili originali: <code>${esc(ws.sensitive_ops_in_original.join(', '))}</code>` : ''}</div>` : ''}
          <h3 style="margin:6px 0;">${esc(rep.title)}</h3>
          <p style="color:var(--muted);margin:4px 0;"><strong>Invariante:</strong> ${esc(rep.target_invariant)} — ${esc(rep.blue_patch_or_rules_summary)}</p>
          <p>
            ${domainBadges}
            <span class="badge b-purple">Functional Survival: ${pctStr(m.functional_survival_rate)}</span>
          </p>
        </div>
        <div class="stage-card" style="margin-bottom:10px;">
          <strong>Controlli Eseguiti vs Non Eseguiti</strong>
          <div><strong>executed_checks:</strong> ${esc((rep.executed_checks || []).join(', ') || 'Nessuno')}</div>
          <div style="color:var(--muted);"><strong>not_executed_checks:</strong> ${esc((rep.not_executed_checks || []).join(', ') || 'Nessuno')}</div>
        </div>
        ${(rep.subagent_traces || []).length ? `<h4>Sub-Agent Fleet (Fog of War: ${rep.subagent_traces.length})</h4>` +
          rep.subagent_traces.map(tr => `<div class="ev-item"><span class="badge ${tr.team === 'RED' ? 'b-red' : 'b-blue'}">${esc(tr.team)} ${esc(tr.role)}</span><span class="badge b-purple">${esc(tr.phase)}</span><span class="badge b-amber">${esc(tr.model_used)}</span>${tr.execution_kind ? `<span class="badge b-blue">${esc(tr.execution_kind)}</span>` : ''}<span style="color:var(--muted);">[keys: ${esc((tr.visible_context_keys || []).join(', '))}]</span> ${esc(tr.summary)}</div>`).join('') : ''}
        ${(rep.deliverable_dir || rep.patch_diff || ws) ? `<div class="stage-card" style="margin:10px 0;">
          <strong>Artefatti Persistenti (deliverable_dir) &amp; Patch Diff</strong>
          ${rep.deliverable_dir ? `<div><strong>deliverable_dir:</strong> <code>${esc(rep.deliverable_dir)}</code> (${esc((rep.deliverable_files || []).length)} file)</div>` : ''}
          ${(rep.deliverable_files || []).length ? `<div style="color:var(--muted);font-size:11px;">${esc(rep.deliverable_files.join(' · '))}</div>` : ''}
          ${rep.patch_diff ? `<pre>${esc(rep.patch_diff)}</pre>` : ''}
          ${ws ? `<div style="margin-top:8px;">
            <div><strong>Workspace Target:</strong> <code>${esc(ws.target_file_path)}</code> (${esc(ws.target_function)}) | untouched=${esc(ws.original_untouched)} | patch_applied=${esc(ws.patch_applied)}</div>
            ${(rep.patch_applicable || rep.certified) && !ws.patch_applied ? `<div style="margin-top:6px;">
              <label class="row"><input type="checkbox" id="ackConfirmApplyChk"> Confermo applicazione patch (crea .orig)</label>
              ${rep.manual_review_required ? `<label class="row" style="color:#fde68a;"><input type="checkbox" id="ackManualReviewChk"> Confermo revisione manuale rischi/semantiche</label>` : ''}
              <div class="row" style="margin-top:6px;">
                <button type="button" onclick="requestAckApproval()">1. Autorizza Monouso (Conferma OS)</button>
                <button type="button" class="primary" ${approvalReady ? '' : 'disabled'} onclick="applyAckPatch('${esc(rep.run_id)}')">2. Applica Patch con Token Monouso</button>
              </div>
              ${approvalReady ? `<div style="font-size:11px;color:#93c5fd;">Token monouso emesso: ${esc(pendingAckApproval.approval_id)} (scade ${esc(pendingAckApproval.expires_at)})</div>` : ''}
            </div>` : ''}
          </div>` : ''}
        </div>` : ''}
        <h4>Macchina a 7 Stati (${(rep.state_transitions || []).length} transizioni)</h4>
        ${(rep.state_transitions || []).map(st => `<p><span class="badge ${st.passed ? 'b-green' : 'b-red'}">${esc(st.state)}</span> <span class="badge b-purple">${esc(st.actor)}</span> ${esc(st.summary)}</p>`).join('')}
        <h4>Round di Mutazione Red & Oracolo Out-of-Band (${(rep.mutation_rounds || []).length})</h4>
        ${(rep.mutation_rounds || []).map(mr => `<div class="claim-card ${mr.bypass_succeeded ? 'supported' : 'refuted'}">
          <strong>Round ${esc(mr.round_index)}</strong> <span class="badge b-red">${esc(mr.attack_class)}</span>
          <span class="badge ${mr.bypass_succeeded ? 'b-red' : 'b-green'}">${esc(mr.oracle_evidence?.oracle_verdict)}</span>
          <span class="badge b-blue">canary_accessed=${esc(mr.oracle_evidence?.fs_diff?.canary_accessed)}</span>
          <span class="badge b-purple">lowerdir_untouched=${esc(mr.oracle_evidence?.fs_diff?.lowerdir_untouched)}</span>
        </div>`).join('')}
      `;
    }
    toggleAckMissionInputs();
    (async () => {
      const [{ scenarios }, models, status, ackData] = await Promise.all([apiFetch('/scenarios'), apiFetch('/models'), apiFetch('/status'), apiFetch('/ack/missions')]);
      document.getElementById('scenarioSelect').innerHTML = scenarios.map(s => `<option value="${esc(s.scenario_id)}">${esc(s.title)} [${esc(s.expected_verdict)}]</option>`).join('');
      const ackList = ackData.missions || status.ack_missions || [];
      document.getElementById('ackMissionSelect').innerHTML = ackList.map(m => `<option value="${esc(m.mission_id)}">${esc(m.title)}</option>`).join('');
      populateModelSelects(models);
      currentAckSessionId = status.ack_session_id || '';
      document.getElementById('useLlmChk').checked = Boolean(status.use_llm);
      if (status.active_case) renderReport(status.active_case);
    })();
  </script>
</body>
</html>
